# v8 = v7 with an honest load test, splice grips and retuned targets.
#
# v7 (1500 updates) passed stages 1-4 by update 96 but stalled at stage 5
# (success 10% -> 25% -> 13%).  Its stage-5 successes were not reinforced:
# 240 of 242 were a single 3-robot row laid at an angle (median 18 deg).  The
# "uniform" load test shares the load among all robots whose centre is over
# the gap, so an angled row with two robot centres over the gap carried twice
# the total load of a straight one (15 -> 30).  Changes:
#
#   - load.load_protocol row_midspan: the load is split equally among the
#     spanning rows and acts at mid-gap on each row's deck (robots not standing
#     on another robot).  The angle trick is gone (0/16/28 deg rows all 15).
#   - physics.splice_grip: a robot that grips while standing on the deck holds
#     every robot below it that it overlaps (>= 15% of its footprint), as the
#     hardware's belly spines can.  Lying across a joint it adds a parallel
#     path to that joint (a doubler plate), so stacking at the front now
#     strengthens the bridge.  Without it a robot on top only adds weight.
#   - curriculum_targets 18 for stages 5-7.  Capacities (row_midspan):
#       gap 1.7: 1 row 15 | + root-joint splice 23 | 2 rows 30
#       gap 2.3: 1 row 12 | + root-joint splice 19.5 | 2 rows 24
#       gap 3.0: 1 row 12 | + 3 splices 22 | 2 rows 24 (stage 7: +-20% anchors)
#     so a single row is never enough, and both widening (rows) and
#     thickening (splices) can reach the target.
#   - entropy_coef 0.015 (0.03 drove v7's entropy from 0.13 to 0.45).
#   - Teacher: half of the demonstrations reinforce by splicing the root joint
#     first (then rows if needed), half by rows (demo_splice_share 0.5).
#
#   python scripts/pretrain_bc.py --config configs/beacon_structured_mappo_static_v8.yaml --eval-episodes 5
#   python scripts/train.py --config configs/beacon_structured_mappo_static_v8.yaml --pretrained runs/beacon_structured_mappo_static_v8/bc_pretrain.pt
environment:
  seed: 7
  curriculum_stage: 1
  max_steps: 1200
  latent_sigma: 0.0
  start_setups: [walker_on_root, walker_behind_root, root_only, none, none, none, none]
  spawn_edge_distance: [2.5, 2.5, 2.5, 2.5, 3.5, 5.0, 0.0]
  randomization_stage: 7
  robot:
    count: 10
  sensor:
    structure_cues: true
    downward_ir_offset: 0.21
  gap:
    width_min: 1.2
    width_max: 3.0
    curriculum_widths: [1.2, 1.2, 1.2, 1.2, 1.7, 2.3, 3.0]
  load:
    target_min: 1.0
    target_max: 3.0
    max_target: 40.0
    load_protocol: row_midspan
    curriculum_targets: [1.0, 1.0, 1.0, 1.0, 18.0, 18.0, 18.0]
  contact:
    anchor_requires_edge_or_contact: true
    anchor_edge_band: 1.2
    anchor_rule: front_downward_ir
  physics:
    model: static
    gravity: 1.0
    anchor_bending_limit: 5.0
    anchor_torsion_limit: 5.0
    extend_on_anchor: true
    ground_contact_max_layer: 1
    splice_grip: true
  beacon:
    enabled: true
    communication_range: 2.5
    max_hops: 4
  reward:
    progress_measure: anchored_frontier
    progress_baseline: 0.9
    climb_delta: 0.8
    climb_cap: 8
    climb_counts_extended: true
    span_delta: 4.0
    mechanical_delta: 3.0
    time_penalty: 0.002
    energy_penalty: 0.002
    anchor_penalty: 0.01
    robot_use_penalty: 0.002
    collapse_penalty: 0.5
    success_reward: 30.0
    beacon_discovery_reward: 0.5
    beacon_gather_delta: 0.5
    idle_penalty: 0.0005
    idle_grace_steps: 5
model:
  architecture: structured_mappo
  branch_hidden: 48
  fused_hidden: 64
  recurrent_hidden: 64
  film: true
  use_heterogeneity: false
  connectivity_inputs: ir_strain_action_cue
training:
  total_updates: 1500
  rollout_steps: 128
  num_envs: 8
  vector_env: subprocess
  recurrent_chunk: 32
  num_minibatches: 4
  ppo_epochs: 4
  learning_rate: 0.0003
  entropy_coef: 0.015
  auxiliary_coef: 0.1
  critic: graph
  critic_agent_conditioned: true
  critic_warmup_updates: 10
  bootstrap_truncation: true
  curriculum_max_stage: 7
  checkpoint_interval: 50
  demo_path: runs/beacon_structured_mappo_static_v8/demos.pt
  bc_coef: 0.5
  bc_coef_final: 0.05
  bc_decay_updates: 300
  bc_batch_episodes: 8
  bc_window_steps: 256
  bc_idle_weight: 0.2
  demo_episodes: 300
  demo_stages: [1, 2, 3, 3, 4, 4, 4, 5, 5, 6, 6, 7]
  demo_epsilon: 0.05
  demo_splice_share: 0.5
  output_dir: runs/beacon_structured_mappo_static_v8
