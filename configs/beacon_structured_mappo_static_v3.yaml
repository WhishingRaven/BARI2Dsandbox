# Static physics tuned so the first construction step (gripping the bank at the
# cliff edge) is learned before anything else.  Changes from
# beacon_structured_mappo_static_v2.yaml, whose first 80 updates stayed near a
# random policy (robots nosed over the edge and fell or backed off, edge grips
# did not increase):
#   - progress_measure: anchored_frontier - only structures that grip the left
#     bank count, so gripping at the edge is rewarded immediately and the reward
#     persists (an anchored robot cannot back off); nosing over and falling
#     earns nothing.  progress_baseline 0.9 starts counting one robot length
#     behind the edge, so any grip near the edge earns part of the reward.
#   - spawn_edge_distance - robots start within 2.5 of the cliff in stage 1,
#     widening per stage, so every episode offers chances at the edge.
#   - 5 robots: stage 1 needs 2 and stages 3-4 need 4; fewer robots share the
#     team reward, so good actions are diluted less, and steps are faster.
#   - entropy_coef 0.04 -> 0.01 so a weak signal is not overridden by the
#     push toward uniform actions.
environment:
  seed: 7
  curriculum_stage: 1
  max_steps: 400
  latent_sigma: 0.0
  spawn_edge_distance: [2.5, 3.5, 5.0, 0.0]
  robot:
    count: 5
  gap:
    width_min: 1.2
    width_max: 3.0
    curriculum_widths: [1.2, 1.7, 2.3, 3.0]
  load:
    target_min: 1.0
    target_max: 3.0
    curriculum_targets: [1.0, 1.5, 2.2, 3.0]
  contact:
    anchor_requires_edge_or_contact: true
    anchor_edge_band: 1.2
  physics:
    model: static
    gravity: 1.0
    anchor_bending_limit: 5.0
    anchor_torsion_limit: 5.0
    extend_on_anchor: true
    ground_contact_max_layer: 1
  beacon:
    enabled: true
    communication_range: 2.5
    max_hops: 4
  reward:
    progress_measure: anchored_frontier
    progress_baseline: 0.9
    span_delta: 4.0
    mechanical_delta: 3.0
    time_penalty: 0.002
    energy_penalty: 0.002
    anchor_penalty: 0.01
    robot_use_penalty: 0.002
    collapse_penalty: 0.5
    success_reward: 30.0
    beacon_discovery_reward: 0.5
    beacon_gather_delta: 0.5
    idle_penalty: 0.0005
    idle_grace_steps: 5
model:
  architecture: structured_mappo
  branch_hidden: 48
  fused_hidden: 64
  recurrent_hidden: 64
  film: true
  use_heterogeneity: false
training:
  total_updates: 1000
  rollout_steps: 400
  learning_rate: 0.0003
  entropy_coef: 0.01
  auxiliary_coef: 0.1
  critic: graph
  bootstrap_truncation: true
  output_dir: runs/beacon_structured_mappo_static_v3
