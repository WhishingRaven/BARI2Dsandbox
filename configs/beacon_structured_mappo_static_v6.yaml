# v6 = v5 with the simulator matched to the hardware design and a BC floor.
#
# v5 (update 792) reached stage 4 at update 376 but stalled there at ~5%
# success.  In 62% of stage-4 episodes a robot gripped the bank behind the
# edge (success 2.7% vs 7.9% without such grips): the old bank-grip mask let a
# robot anchor whenever any planar IR ray (front/back/left/right) saw the cliff
# within 1.2 of its centre - up to 0.75 behind the edge, even facing sideways.
# Changes:
#
#   - sensor.downward_ir_offset 0.21: the belly IR sits 4 cm behind the front
#     of the 15 cm body (0.45 - 0.24 = 0.21 ahead of the centre), as designed.
#   - contact.anchor_rule front_downward_ir: a ground-level robot grips the bank
#     only when that front belly IR sees no floor while its centre is still on
#     the bank (front feet over the lip) - the design's "stop and grip where
#     there is nothing below" rule.  Robot-to-robot grips are unchanged.
#   - bc_coef 0.5 -> 0.05 (not 0) over 300 updates, so the teacher's rarely
#     explored steps (release stray grips, climb behind the root) keep a small
#     pull after the anneal; PPO still wins where its advantage disagrees.
#   - Demonstrations are regenerated (the belly IR reading changed) and
#     weighted towards stages 3-5: demo_episodes 300 over demo_stages.
#
#   python scripts/pretrain_bc.py --config configs/beacon_structured_mappo_static_v6.yaml --eval-episodes 5
#   python scripts/train.py --config configs/beacon_structured_mappo_static_v6.yaml \
#     --pretrained runs/beacon_structured_mappo_static_v6/bc_pretrain.pt
environment:
  seed: 7
  curriculum_stage: 1
  max_steps: 400
  latent_sigma: 0.0
  start_setups: [walker_on_root, walker_behind_root, root_only, none, none, none, none]
  spawn_edge_distance: [2.5, 2.5, 2.5, 2.5, 3.5, 5.0, 0.0]
  randomization_stage: 7
  robot:
    count: 5
  sensor:
    structure_cues: true
    downward_ir_offset: 0.21
  gap:
    width_min: 1.2
    width_max: 3.0
    curriculum_widths: [1.2, 1.2, 1.2, 1.2, 1.7, 2.3, 3.0]
  load:
    target_min: 1.0
    target_max: 3.0
    curriculum_targets: [1.0, 1.0, 1.0, 1.0, 1.5, 2.2, 3.0]
  contact:
    anchor_requires_edge_or_contact: true
    anchor_edge_band: 1.2
    anchor_rule: front_downward_ir
  physics:
    model: static
    gravity: 1.0
    anchor_bending_limit: 5.0
    anchor_torsion_limit: 5.0
    extend_on_anchor: true
    ground_contact_max_layer: 1
  beacon:
    enabled: true
    communication_range: 2.5
    max_hops: 4
  reward:
    progress_measure: anchored_frontier
    progress_baseline: 0.9
    climb_delta: 0.8
    climb_cap: 1
    span_delta: 4.0
    mechanical_delta: 3.0
    time_penalty: 0.002
    energy_penalty: 0.002
    anchor_penalty: 0.01
    robot_use_penalty: 0.002
    collapse_penalty: 0.5
    success_reward: 30.0
    beacon_discovery_reward: 0.5
    beacon_gather_delta: 0.5
    idle_penalty: 0.0005
    idle_grace_steps: 5
model:
  architecture: structured_mappo
  branch_hidden: 48
  fused_hidden: 64
  recurrent_hidden: 64
  film: true
  use_heterogeneity: false
  connectivity_inputs: ir_strain_action_cue
training:
  total_updates: 1500
  rollout_steps: 128
  num_envs: 8
  vector_env: subprocess
  recurrent_chunk: 32
  num_minibatches: 4
  ppo_epochs: 4
  learning_rate: 0.0003
  entropy_coef: 0.01
  auxiliary_coef: 0.1
  critic: graph
  critic_agent_conditioned: true
  critic_warmup_updates: 10
  bootstrap_truncation: true
  curriculum_max_stage: 7
  checkpoint_interval: 50
  demo_path: runs/beacon_structured_mappo_static_v6/demos.pt
  bc_coef: 0.5
  bc_coef_final: 0.05
  bc_decay_updates: 300
  bc_batch_episodes: 4
  bc_idle_weight: 0.2
  demo_episodes: 300
  demo_stages: [1, 2, 3, 3, 4, 4, 4, 5, 5, 6]
  output_dir: runs/beacon_structured_mappo_static_v6
