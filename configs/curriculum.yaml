environment:
  seed: 7
  curriculum_stage: 1
  max_steps: 1000
  latent_sigma: 0.0
  gap:
    width_min: 3.0
    width_max: 5.0
    orientation_jitter_deg: 18.0
    irregularity: 0.35
  sensor:
    sensor_noise: 0.015
  actuator_noise: 0.015
model:
  architecture: gru
  branch_hidden: 32
  fused_hidden: 64
  recurrent_hidden: 64
  film: false
  use_heterogeneity: false
training:
  total_updates: 1000
  rollout_steps: 400
  learning_rate: 0.0003
  critic: mlp
  output_dir: runs/curriculum
  curriculum_enabled: true
  curriculum_window: 25
  curriculum_success_threshold: 0.7
  curriculum_max_stage: 4
