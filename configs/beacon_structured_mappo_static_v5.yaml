# Accelerated, demonstration-guided training on the v4 task (same 7-stage
# start-state curriculum, structure cues, rewards and physics).  v4 reached
# stage 2 after 1500 updates: it collapsed onto IDLE early, its only gradient
# came from a team advantage shared by all robots, and each update saw one
# 400-step episode.  Changes:
#
#   - Demonstration pretraining (reverse curriculum + behaviour cloning):
#       python scripts/pretrain_bc.py --config configs/beacon_structured_mappo_static_v5.yaml
#     runs the scripted teacher from every stage's start state (epsilon-
#     perturbed), saves the demonstrations to demo_path and a behaviour-cloned
#     actor; PPO starts from it (train.py --pretrained ...) and keeps an
#     annealed BC term: L = L_PPO + bc_coef * L_BC + auxiliary_coef * L_aux,
#     bc_coef 0.5 -> 0 over the first 300 updates.
#   - Agent-conditioned centralized value: the graph critic outputs
#     V_i = f(h_i, mean_j h_j) per robot, so each robot gets its own advantage.
#     The first 10 updates train only the critic so the fresh critic does not
#     push the pretrained policy around.
#   - Connectivity branch reads IR + strain + previous action + local contact
#     cues (connectivity / persistence targets become observable).
#   - The actor encodes a whole rollout at once and runs it through nn.GRU
#     (truncated BPTT in chunks of 32 steps from the stored hidden states).
#   - 8 parallel environments in worker processes, 128 steps each
#     (1024 team transitions per update), 4 PPO minibatches.
environment:
  seed: 7
  curriculum_stage: 1
  max_steps: 400
  latent_sigma: 0.0
  start_setups: [walker_on_root, walker_behind_root, root_only, none, none, none, none]
  spawn_edge_distance: [2.5, 2.5, 2.5, 2.5, 3.5, 5.0, 0.0]
  randomization_stage: 7
  robot:
    count: 5
  sensor:
    structure_cues: true
  gap:
    width_min: 1.2
    width_max: 3.0
    curriculum_widths: [1.2, 1.2, 1.2, 1.2, 1.7, 2.3, 3.0]
  load:
    target_min: 1.0
    target_max: 3.0
    curriculum_targets: [1.0, 1.0, 1.0, 1.0, 1.5, 2.2, 3.0]
  contact:
    anchor_requires_edge_or_contact: true
    anchor_edge_band: 1.2
  physics:
    model: static
    gravity: 1.0
    anchor_bending_limit: 5.0
    anchor_torsion_limit: 5.0
    extend_on_anchor: true
    ground_contact_max_layer: 1
  beacon:
    enabled: true
    communication_range: 2.5
    max_hops: 4
  reward:
    progress_measure: anchored_frontier
    progress_baseline: 0.9
    climb_delta: 0.8
    climb_cap: 1
    span_delta: 4.0
    mechanical_delta: 3.0
    time_penalty: 0.002
    energy_penalty: 0.002
    anchor_penalty: 0.01
    robot_use_penalty: 0.002
    collapse_penalty: 0.5
    success_reward: 30.0
    beacon_discovery_reward: 0.5
    beacon_gather_delta: 0.5
    idle_penalty: 0.0005
    idle_grace_steps: 5
model:
  architecture: structured_mappo
  branch_hidden: 48
  fused_hidden: 64
  recurrent_hidden: 64
  film: true
  use_heterogeneity: false
  connectivity_inputs: ir_strain_action_cue
training:
  total_updates: 1500
  rollout_steps: 128
  num_envs: 8
  vector_env: subprocess
  recurrent_chunk: 32
  num_minibatches: 4
  ppo_epochs: 4
  learning_rate: 0.0003
  entropy_coef: 0.01
  auxiliary_coef: 0.1
  critic: graph
  critic_agent_conditioned: true
  critic_warmup_updates: 10
  bootstrap_truncation: true
  curriculum_max_stage: 7
  checkpoint_interval: 50
  demo_path: runs/beacon_structured_mappo_static_v5/demos.pt
  bc_coef: 0.5
  bc_coef_final: 0.0
  bc_decay_updates: 300
  bc_batch_episodes: 4
  bc_idle_weight: 0.2
  output_dir: runs/beacon_structured_mappo_static_v5
