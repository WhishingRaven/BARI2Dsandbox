[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bari2d"
version = "0.1.0"
description = "Decentralized multi-robot bridge construction research simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["bari2d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

